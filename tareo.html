<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex">
<title>Mi tarjeta de tareo · MukiCloud</title>
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0d0f14; --card:#151922; --card2:#1b2029; --border:#2a303c;
    --text:#e8ecf3; --text2:#aab3c2; --text3:#7b8493; --gold:#e5b45b; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       padding:18px 14px 40px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .marca{text-align:center;margin-bottom:16px}
  .marca b{font-size:19px;letter-spacing:1px}
  .marca b span{color:var(--gold)}
  .marca div{font-size:10.5px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .pad{padding:16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px}
  input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
        color:var(--text);padding:12px 14px;font-size:16px;font-family:inherit}
  input:focus{outline:none;border-color:var(--gold)}
  .campo{margin-bottom:14px}
  button.principal{width:100%;background:var(--gold);color:#241a05;border:none;border-radius:10px;
        padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  button.principal:disabled{opacity:.6;cursor:default}
  .aviso{margin-top:12px;font-size:12px;color:#fca5a5;text-align:center;line-height:1.45}
  .pie{margin-top:14px;font-size:11px;color:var(--text3);text-align:center;line-height:1.5}
  .franja{height:46px;position:relative}
  .franja .et{position:absolute;top:13px;left:14px;font-size:11px;font-weight:700;letter-spacing:.6px;
        text-transform:uppercase;color:rgba(255,255,255,.92)}
  .franja .flag{position:absolute;top:9px;right:12px;background:rgba(0,0,0,.35);color:#fff;
        border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
  .foto{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block}
  .foto-ini{width:132px;height:132px;border-radius:50%;background:var(--card2);color:var(--text2);
        display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px}
  .mini{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center}
  .mini u{display:block;font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);text-decoration:none}
  .mini b{display:block;font-size:15.5px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#1a2744;color:#fff;padding:6px 10px;text-align:left;font-weight:700}
  td{padding:5px 10px;border-bottom:1px solid var(--border)}
  .chip{display:inline-block;min-width:32px;text-align:center;color:#fff;font-weight:800;
        font-size:10px;border-radius:6px;padding:3px 6px}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin:16px 0 7px}
  .nota{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
        font-size:12.5px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
  .otra{display:block;width:100%;margin-top:16px;background:none;border:1px solid var(--border);
        color:var(--text2);border-radius:10px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca"><b>MUKI<span>CLOUD</span></b><div>Mi tarjeta de tareo</div></div>
  <div id="app"></div>
</div>

<script>
// Página pública: NO trae datos de la operación. Solo pregunta al servidor por una tarjeta
// concreta, y el servidor responde únicamente con los datos de esa persona.
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const soles = n => 'S/ ' + (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});

function formulario(msg){
  app.innerHTML =
    '<div class="card pad">' +
      '<div class="campo"><label>Tu DNI</label>' +
        '<input id="dni" type="tel" inputmode="numeric" maxlength="8" placeholder="12345678" autocomplete="off"></div>' +
      // La pista NO se escribe en la pantalla: si dice de qué son las letras, deja de ser clave.
      // Cada trabajador la recibe de Recursos Humanos.
      '<div class="campo"><label>Tu clave</label>' +
        '<input id="letras" type="password" maxlength="3" placeholder="• • •" autocomplete="off" ' +
        'inputmode="text" style="letter-spacing:4px"></div>' +
      '<button class="principal" id="ver">Ver mi tarjeta</button>' +
      (msg ? '<div class="aviso">' + esc(msg) + '</div>' : '') +
      '<div class="pie">¿No tienes tu clave? Pídesela a Recursos Humanos.<br>' +
      'Solo se muestra el mes en curso.</div>' +
    '</div>';
  document.getElementById('ver').onclick = consultar;
  document.getElementById('letras').addEventListener('keydown', e => { if(e.key==='Enter') consultar(); });
  document.getElementById('dni').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('letras').focus(); });
  document.getElementById('dni').focus();
}

async function consultar(){
  const dni = (document.getElementById('dni').value||'').trim();
  const letras = (document.getElementById('letras').value||'').trim();
  const btn = document.getElementById('ver');
  btn.disabled = true; btn.textContent = 'Consultando…';
  try{
    const r = await fetch('/api/tarjeta', { method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify({dni, letras}) });
    const d = await r.json();
    if(!d || !d.ok){ formulario((d && d.msg) || 'No se pudo consultar. Intenta de nuevo.');
                     document.getElementById('dni').value = dni;
                     document.getElementById('letras').value = letras; return; }
    pintar(d);
  }catch(e){
    formulario('Sin conexión. Intenta de nuevo cuando tengas señal.');
    document.getElementById('dni').value = dni;
  }
}

function nombreMes(m){
  const N=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [a,b]=String(m).split('-'); return (N[parseInt(b,10)-1]||b)+' '+a;
}
const mini = (t,v,c) => '<div class="mini"><u>'+t+'</u><b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b></div>';

function pintar(d){
  const t=d.trabajador, r=d.resumen, b=d.bandera, pen=d.pendientes;
  const ini=String(t.nombre||'').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const filas=d.dias.map(x =>
    '<tr><td>'+esc(x.dia)+'</td>'+
    '<td><span class="chip" style="background:'+esc(x.color)+'">'+esc(x.marca)+'</span></td>'+
    '<td style="color:var(--text3)">'+esc(x.concepto)+'</td>'+
    '<td style="text-align:right">'+x.tareas+'</td>'+
    '<td style="text-align:right;color:var(--text2)">'+soles(x.monto)+'</td></tr>').join('');

  app.innerHTML =
  '<div class="card">'+
    '<div class="franja" style="background:linear-gradient(135deg,'+b.color+' 0%,'+b.color+'66 100%)">'+
      '<span class="et">Tarjeta de tareo · '+esc(nombreMes(d.mes))+'</span>'+
      '<span class="flag">'+b.icono+' '+esc(b.txt)+'</span></div>'+
    '<div style="text-align:center;margin-top:14px;padding:0 16px">'+
      '<div style="display:inline-block;border-radius:50%;padding:4px;background:var(--card);box-shadow:0 0 0 2px '+b.color+'">'+
        (t.foto ? '<img class="foto" src="'+esc(t.foto)+'" alt="">' : '<div class="foto-ini">'+(ini||'—')+'</div>')+'</div>'+
      '<div style="margin-top:9px;font-size:18px;font-weight:800;line-height:1.2">'+esc(t.nombre)+'</div>'+
      '<div style="font-size:12px;font-weight:700;margin-top:2px;color:'+b.color+'">'+esc(t.cargo||'—')+'</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:3px">DNI '+esc(t.dni)+
        (t.guardia?' · Guardia '+esc(t.guardia):'')+' · Jornal '+soles(t.jornal)+'</div>'+
    '</div>'+
    '<div class="pad">'+
      '<div class="grid">'+
        mini('Días', r.diasTrab)+mini('Tareas', r.tareas)+mini('D. libres', r.dlTomados)+
        mini('Faltas', r.faltas, r.faltas?'#f87171':'')+
        mini('Ganado', soles(r.pago), 'var(--gold)')+
        mini('Neto', soles(r.neto), r.neto<r.pago?'#f59e0b':'var(--ok)')+
      '</div>'+

      '<div class="sec">Tareo de '+esc(nombreMes(d.mes))+'</div>'+
      (filas
        ? '<div style="overflow-x:auto;border-radius:10px"><table>'+
          '<thead><tr><th>Día</th><th>Marca</th><th>Concepto</th><th style="text-align:right">Tareas</th><th style="text-align:right">Monto</th></tr></thead>'+
          '<tbody>'+filas+'</tbody>'+
          '<tfoot><tr style="font-weight:800"><td colspan="3">Total del mes</td>'+
          '<td style="text-align:right">'+r.tareas+'</td>'+
          '<td style="text-align:right;color:var(--gold)">'+soles(r.pago)+'</td></tr></tfoot>'+
          '</table></div>'
        : '<div class="nota">Todavía no hay tareos registrados este mes.</div>')+

      '<div class="sec">Pendientes</div>'+
      '<div class="grid">'+
        mini('Préstamo', soles(pen.prestamo), pen.prestamo?'#f87171':'')+
        mini('Descuento', soles(pen.descuento), pen.descuento?'#f59e0b':'')+
        mini('Neto a pagar', soles(r.neto), 'var(--ok)')+
      '</div>'+
      (pen.detalle ? '<div class="nota" style="margin-top:9px"><b>Detalle:</b> '+esc(pen.detalle)+'</div>' : '')+
      (pen.anotacion ? '<div class="sec">Anotaciones de RRHH</div><div class="nota">'+esc(pen.anotacion)+'</div>' : '')+

      '<button class="otra" onclick="formulario()">Consultar otro DNI</button>'+
      '<div class="pie">Si algo no cuadra, avisa a Recursos Humanos.<br>Los tareos se actualizan conforme los registra tu jefe de guardia.</div>'+
    '</div>'+
  '</div>';
  window.scrollTo(0,0);
}

formulario();
</script>
</body>
</html>
