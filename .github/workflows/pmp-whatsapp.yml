name: PMP diario por WhatsApp

on:
  schedule:
    # 11:00 UTC = 6:00 a.m. en Peru (UTC-5). Cambia la hora aqui si la quieres a otra.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia del plan a enviar (1-24). Vacio = el que toca hoy."
        required: false
        type: string
      seco:
        description: "Solo mostrar el mensaje, sin enviarlo"
        required: false
        type: boolean
        default: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enviar el resumen del dia
        env:
          PMP_PROVIDER: ${{ vars.PMP_PROVIDER || 'callmebot' }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: |
          python3 pmp/enviar_whatsapp.py \
            ${{ inputs.dia && format('--dia {0}', inputs.dia) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}
