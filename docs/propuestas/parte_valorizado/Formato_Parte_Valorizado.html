<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parte de guardia valorizado — maqueta</title>
<style>:root{--coal:#ffffff;--coal2:#ffffff;--coal3:#fafafa;--coal4:#ffffff;--border:#9a9a9a;--text:#111;--text2:#333;--text3:#555}
*{box-sizing:border-box}
body{margin:0;background:#f1f1f1;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:13px}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 160px}
.modal{background:#fff;border:2px solid #111;border-radius:12px;padding:22px 22px 26px}
.mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:2px solid #111;padding-bottom:10px}
.mt h1{margin:0;font-size:15px;letter-spacing:1px;color:#111;font-weight:900}
.x{color:#111;font-size:18px}
label{display:block;font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#444;margin-bottom:5px}
input,select,textarea{width:100%;background:#fff;border:1px solid #888;border-radius:6px;padding:8px 10px;color:#111;font:inherit;font-size:13px;font-weight:600}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr{border:1px solid #888;border-left:5px solid #111;border-radius:10px;padding:16px 20px;margin-top:16px;background:#fafafa}
.frh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.frh b{color:#111;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.sec{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:999px;background:#fff;color:#111;border:1.5px solid #111}
.val{margin-left:auto;font-size:12px;color:#333}.val b{color:#111;font-size:14.5px}
.dis{border:1px solid #aaa;border-radius:9px;padding:12px 14px;margin-top:10px;background:#fff}
.dis h4{margin:0 0 10px;color:#111;font-size:12.5px}
.row{margin-bottom:10px}
.nuevo{border:2px dashed #111;border-radius:9px;padding:10px 12px;margin-top:10px;background:#fff}
.nuevo .tag{float:right;font-size:9.5px;font-weight:900;letter-spacing:1px;color:#fff;background:#111;border-radius:5px;padding:2px 7px}
.ac{display:flex;gap:8px;flex-wrap:wrap}
.ac label{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:12.5px;color:#111;background:#fff;border:1px solid #888;border-radius:7px;padding:8px 11px;margin:0;cursor:pointer;font-weight:700}
.ac input{width:auto}
.ac label.on{border:2px solid #111;background:#ececec}
.tot{margin-top:10px;border:1px dashed #666;border-radius:8px;padding:8px 12px;font-size:12px;color:#333}
.tot b{color:#111}
.add{margin-top:10px;border:1px dashed #888;border-radius:8px;padding:8px;color:#333;font-weight:700;font-size:12.5px}
.mas{margin-top:8px;background:#f0f0f0;border-radius:7px;padding:8px 12px;font-size:11px;font-weight:800;color:#111;letter-spacing:.5px}
.prod{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(241,241,241,0),#f1f1f1 20%);padding:18px 14px 14px}
.prod .in{max-width:780px;margin:0 auto;border:2px solid #111;background:#fff;border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;align-items:center;box-shadow:0 -6px 18px rgba(0,0,0,.12)}
.prod .lb{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#444}
.prod .s{font-size:24px;font-weight:900;font-family:'Courier New',ui-monospace,monospace;margin-top:2px;color:#111}
.bar{height:9px;border-radius:5px;background:#ddd;overflow:hidden;margin-top:7px;border:1px solid #999}.bar i{display:block;height:100%;background:#111 !important}
.pc{font-size:19px;font-weight:900;margin-top:2px;color:#111 !important}
.dd{display:flex;gap:6px;margin-top:5px}.dd span{font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px;background:#fff;border:1px solid #888;white-space:nowrap;color:#111}
.dd span.ok{background:#111;color:#fff;border-color:#111}.dd span.no{background:#fff;color:#111;border:1.5px dashed #111}
.fal{font-size:11.5px;color:#333;margin-top:4px}
@media (max-width:640px){.dd{flex-wrap:wrap}.dd span{font-size:11px;padding:4px 6px}.g3{grid-template-columns:1fr 1fr}.prod .in{grid-template-columns:1fr 1fr}.prod .in>div:first-child{grid-column:1/-1}.modal{padding:16px 14px}.fr{padding:14px}}
</style></head><body>
<div class="wrap"><div class="modal">
  <div class="mt"><h1>📋 REPORTE DE JEFE DE GUARDIA — NV 2820</h1><span class="x">✕</span></div>
  <div class="g3">
    <div><label>Jefe de guardia</label><select><option>SOTELO BENGOLEA MANUEL KENEDY</option></select></div>
    <div><label>Turno</label><select><option>Noche</option></select></div>
    <div><label>Fecha</label><input value="19/11/2026"></div>
  </div>
  <div id="labores"></div>
</div></div>

<div class="prod"><div class="in">
  <div><div class="lb">Producción de la guardia</div><div class="s" id="p-s">S/ 0.00</div>
    <div class="bar"><i id="p-bar"></i></div><div class="fal" id="p-fal"></div></div>
  <div><div class="lb">Meta S/ 20,095.34</div><div class="pc" id="p-pc">0 %</div></div>
  <div><div class="lb">Disparos (mín. 2 · 2 · 1)</div><div class="dd"><span id="d-g">G 0/2</span><span id="d-r">R 0/2</span><span id="d-c">C 0/1</span></div></div>
</div></div>

<script>
/* Configuración que pone Finanzas UNA vez. El jefe de guardia no ve estos precios. */
const SEC={galeria:{n:'Galería',a:2.7,h:2.7,pm:1650,pp:60},rampa:{n:'Rampa',a:3.5,h:3.5,pm:2150,pp:75},chimenea:{n:'Chimenea',a:1.5,h:2.4,pm:1350,pp:0,pu:310}};
const PT=3.3+14.5+3.5+6.5, META=20095.3412;
const L=[
 {n:'RA BRENDA — RAMPA BRENDA',c:'#60a5fa',t:'rampa',acarreo:'todo',d:[{m:1.5,sost:'mp',p:6,ma:0,tp:53,tc:51},{m:1.5,sost:'mp',p:5,ma:0,tp:52,tc:50}]},
 {n:'GL NW-5',c:'#d97706',t:'galeria',acarreo:'todo',d:[{m:1.5,sost:'mp',p:7,ma:1,tp:34,tc:32},{m:1.5,sost:'mp',p:7,ma:1,tp:34,tc:32}]},
 {n:'CH 6905',c:'#94a3b8',t:'chimenea',acarreo:'todo',puntales:0,d:[{m:1.0,sost:'',p:0,ma:0,tp:18,tc:17},{m:1.0,sost:'',p:0,ma:0,tp:18,tc:17}]},
];
const S=v=>'S/ '+v.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
function valLabor(l){ const s=SEC[l.t]; const m=l.d.reduce((a,x)=>a+(+x.m||0),0), p=l.d.reduce((a,x)=>a+(+x.p||0),0);
  const tonD=m*s.a*s.h*2.7; const ton=l.acarreo==='todo'?tonD:Math.min(tonD,+l.tonAc||0);
  return {m,p,ton,tonD,v:m*s.pm+ton*PT+p*s.pp+(l.t==='chimenea'?(+l.puntales||0)*s.pu:0), nd:l.d.filter(x=>+x.m>0).length}; }
function pintar(){
  const box=document.getElementById('labores');
  box.innerHTML=L.map((l,i)=>{ const s=SEC[l.t], r=valLabor(l); return `
  <div class="fr" style="--c:${l.c}">
    <div class="frh"><b>■ ${l.n}</b><span class="sec">${s.n} · ${s.a} × ${s.h}</span><span class="val">Valor de esta labor: <b id="v${i}">${S(r.v)}</b></span></div>
    <div class="row"><label>Trabajos ejecutados</label><textarea rows="2" placeholder="Detalle de trabajos realizados en el turno..."></textarea></div>
    ${l.d.map((x,k)=>`<div class="dis"><h4>💥 Disparo ${k+1}</h4>
      <div class="g2 row"><div><label>Avance metros lineales</label><input type="number" step="0.1" value="${x.m}" oninput="L[${i}].d[${k}].m=this.value;upd()"></div>
        <div><label>Tipo de sostenimiento</label><select><option ${x.sost==='mp'?'selected':''}>Malla y Perno</option><option ${x.sost===''?'selected':''}>Sin sostenimiento</option><option>Cimbra</option></select></div></div>
      ${x.sost==='mp'?`<div class="g2 row"><div><label>N° de pernos (PH 7 + malla)</label><input type="number" value="${x.p}" oninput="L[${i}].d[${k}].p=this.value;upd()"></div><div><label>N° de mallas</label><input type="number" value="${x.ma}"></div></div>`:''}
      <div class="g3"><div><label>Taladros perforados</label><input value="${x.tp}"></div><div><label>Taladros cargados</label><input value="${x.tc}"></div><div><label>Longitud taladro (m)</label><input value="1.80"></div></div>
      <div class="mas">💣 MASAS / EXPLOSIVOS · registrados</div></div>`).join('')}
    <div class="add">➕ Agregar disparo</div>
    ${l.t==='chimenea'?`<div class="nuevo"><span class="tag">NUEVO</span><label>Puntales instalados</label><input type="number" min="0" value="${l.puntales||0}" oninput="L[${i}].puntales=this.value;upd()" style="max-width:180px"></div>`:''}
    <div class="nuevo"><span class="tag">NUEVO</span><label>¿Se acarreó lo disparado?</label>
      <div class="ac"><label class="${l.acarreo==='todo'?'on':''}"><input type="radio" name="ac${i}" ${l.acarreo==='todo'?'checked':''} onchange="L[${i}].acarreo='todo';pintar()"> Sí, todo (${r.tonD.toFixed(1)} t)</label>
        <label class="${l.acarreo!=='todo'?'on':''}"><input type="radio" name="ac${i}" ${l.acarreo!=='todo'?'checked':''} onchange="L[${i}].acarreo='parte';pintar()"> Quedó material en la labor</label></div>
      ${l.acarreo!=='todo'?`<div style="margin-top:8px;max-width:220px"><label>Toneladas acarreadas</label><input type="number" value="${l.tonAc||''}" oninput="L[${i}].tonAc=this.value;upd()"></div>`:''}
    </div>
    <div class="tot">Σ TOTALES DEL FRENTE · ${l.d.length} DISPAROS &nbsp; 📏 Avance: <b id="m${i}">${r.m.toFixed(1)} m</b> &nbsp; 🔩 Pernos: <b id="pe${i}">${r.p}</b> &nbsp; ⛏ Acarreo: <b id="t${i}">${r.ton.toFixed(1)} t</b></div>
  </div>`; }).join('');
  upd();
}
function upd(){
  let tot=0; const dis={galeria:0,rampa:0,chimenea:0};
  L.forEach((l,i)=>{ const r=valLabor(l); tot+=r.v; dis[l.t]+=r.nd;
    const set=(id,t)=>{const e=document.getElementById(id); if(e) e.textContent=t;};
    set('v'+i,S(r.v)); set('m'+i,r.m.toFixed(1)+' m'); set('pe'+i,r.p); set('t'+i,r.ton.toFixed(1)+' t'); });
  const pc=tot/META*100, ok=pc>=100;
  document.getElementById('p-s').textContent=S(tot);
  const b=document.getElementById('p-bar'); b.style.width=Math.min(100,pc)+'%'; b.style.background=ok?'#3ddc84':pc>=80?'#f5a524':'#ff5a5a';
  const pce=document.getElementById('p-pc'); pce.textContent=Math.round(pc)+' % '+(ok?'✔':''); pce.style.color=ok?'#8df0b8':pc>=80?'#f7c35c':'#ff8a8a';
  document.getElementById('p-fal').textContent=ok?'Meta cumplida: +'+S(tot-META)+' sobre la meta':'Faltan '+S(META-tot)+' para la meta';
  [['d-g','G',dis.galeria,2],['d-r','R',dis.rampa,2],['d-c','C',dis.chimenea,1]].forEach(([id,l,v,m])=>{ const e=document.getElementById(id); e.textContent=l+' '+v+'/'+m+(v>=m?' ✔':''); e.className=v>=m?'ok':'no'; });
}
pintar();
</script></body></html>
