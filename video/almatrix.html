<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ALMATRIX · MukiCloud — maestro</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   MUKICLOUD — pieza de motion graphics, render determinista.
   Todo se dibuja en función del número de cuadro: RENDER(frame).
   Nada de animaciones por reloj, para que el render salga perfecto.
   120 BPM → golpe cada 0.5s, compás cada 2s. Los cortes caen en compás.
   ═══════════════════════════════════════════════════════════════════════ */
const W=1920, H=1080, FPS=30, BEAT=0.5;
const cv=document.getElementById('c'), X=cv.getContext('2d');

/* ── Paleta: la del sistema real ──────────────────────────────────── */
const C={
  void:'#05070b', deep:'#0b0e14', navy:'#111a2b', navy2:'#1a2744',
  gold:'#3b9bff', gold2:'#8fd3ff', deepblue:'#1f6feb', ink:'#e8ecf3', mute:'#8b96a8', dim:'#5a6475',
  blue:'#60a5fa', green:'#22d3a5', ok:'#22c55e', red:'#f87171', amber:'#f59e0b',
  purple:'#a855f7', rock:'#161a22'
};
const FONT='-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';

/* ── Utilidades ───────────────────────────────────────────────────── */
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eOut=t=>1-Math.pow(1-t,3);
const eOut5=t=>1-Math.pow(1-t,5);
const eIn=t=>t*t*t;
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eBack=t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const pulse=(t,n=1)=>Math.sin(t*Math.PI*2*n);
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(x,y,w,h,r){const g=X;g.beginPath();r=Math.min(r,w/2,h/2);
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function f(size,weight=700,family=FONT){return weight+' '+size+'px '+family}

/* texto con aberración cromática + brillo: el truco que lo hace filmico */
function txt(s,x,y,o={}){
  const g=X, size=o.size||60, w=o.weight||800, al=o.align||'left';
  g.save(); g.font=f(size,w); g.textAlign=al; g.textBaseline=o.base||'alphabetic';
  if(o.track){ // tracking manual
    g.restore(); return tracked(s,x,y,o);
  }
  const a=o.alpha==null?1:o.alpha;
  if(o.glow){ g.shadowColor=o.glow; g.shadowBlur=o.glowSize||34; }
  if(o.ab){ // aberración
    g.globalAlpha=g.globalAlpha*a*.5; g.globalCompositeOperation='screen';
    g.fillStyle='#ff2b4d'; g.fillText(s,x-o.ab,y);
    g.fillStyle='#19e6ff'; g.fillText(s,x+o.ab,y);
    g.globalCompositeOperation='source-over';
  }
  g.globalAlpha=g.globalAlpha*a; g.fillStyle=o.color||C.ink; g.fillText(s,x,y);
  g.restore();
}
function trackMin(size,t){ return Math.max(t||0, size*0.115) }
function tracked(s,x,y,o={}){
  const g=X, size=o.size||40, tr=trackMin(size,o.track);
  g.save(); g.font=f(size,o.weight||700); g.textBaseline=o.base||'alphabetic';
  g.globalAlpha=g.globalAlpha*(o.alpha==null?1:o.alpha); g.fillStyle=o.color||C.ink;
  if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.glowSize||20}
  const ch=[...s]; let tw=0; ch.forEach(c=>tw+=g.measureText(c).width+tr);
  tw-=tr; let cx = o.align==='center'? x-tw/2 : o.align==='right'? x-tw : x;
  ch.forEach(c=>{g.fillText(c,cx,y);cx+=g.measureText(c).width+tr});
  g.restore(); return tw;
}
function measure(s,size,w=800){X.save();X.font=f(size,w);const m=X.measureText(s).width;X.restore();return m}

/* ── Tipografía cinética: palabra por palabra, escalonada ─────────── */
function kinetic(lines,t,o={}){
  const size=o.size||86, lh=o.lh||size*1.22, cx=o.x||W/2, top=o.y||H/2;
  const stag=o.stagger==null?.07:o.stagger, dur=o.dur||.5, start=o.start||0;
  let i=0, totalW=[];
  lines.forEach(ln=>totalW.push(ln.map(w=>measure(w.t||w,size,w.w||o.weight||800))));
  lines.forEach((ln,li)=>{
    const gap=o.gap==null?size*.26:o.gap;
    let lw=totalW[li].reduce((a,b)=>a+b,0)+gap*(ln.length-1);
    let x=cx-lw/2, y=top+li*lh;
    ln.forEach((w,wi)=>{
      const word=w.t||w, p=eOut(prog(t,start+i*stag,start+i*stag+dur)); i++;
      if(p>0){
        const dy=(1-p)*size*.42, bl=(1-p)*10;
        X.save(); if(bl>.4)X.filter='blur('+bl.toFixed(2)+'px)';
        txt(word,x,y+dy,{size,weight:w.w||o.weight||800,alpha:p*(o.alpha==null?1:o.alpha),
          color:w.c||o.color||C.ink, glow:w.g||o.glow, glowSize:o.glowSize, ab:o.ab});
        X.restore();
      }
      x+=totalW[li][wi]+(o.gap==null?size*.26:o.gap);
    });
  });
}


/* El isotipo de MukiCloud: una nube con la montaña dentro. */
function isotipo(cx,cy,S,a,t){
  X.save(); X.globalAlpha=a;
  const g=X.createLinearGradient(cx-S*.6,cy-S*.5,cx+S*.6,cy+S*.4);
  g.addColorStop(0,'#8fd3ff'); g.addColorStop(.5,'#3b9bff'); g.addColorStop(1,'#1f6feb');
  // montaña
  X.save();
  X.beginPath();
  X.moveTo(cx-S*.30,cy+S*.235); X.lineTo(cx-S*.055,cy-S*.125); X.lineTo(cx+S*.12,cy+S*.235);
  X.closePath(); X.fillStyle='#2e6ea6'; X.fill();
  X.beginPath();
  X.moveTo(cx-S*.045,cy+S*.235); X.lineTo(cx+S*.145,cy-S*.02); X.lineTo(cx+S*.32,cy+S*.235);
  X.closePath(); X.fillStyle='#9ad9ff'; X.fill();
  X.restore();
  // nube alrededor
  X.beginPath();
  X.arc(cx-S*.27,cy+S*.045,S*.235,Math.PI*.5,Math.PI*1.5);
  X.arc(cx-S*.02,cy-S*.145,S*.30,Math.PI*1.02,Math.PI*1.86);
  X.arc(cx+S*.295,cy+S*.015,S*.225,Math.PI*1.36,Math.PI*.5);
  X.closePath();
  X.shadowColor='rgba(59,155,255,.6)'; X.shadowBlur=S*.34;
  X.strokeStyle=g; X.lineWidth=S*.105; X.lineJoin='round'; X.stroke();
  X.shadowBlur=0;
  // el punto claro del arco, como en la marca
  const pa=(t||0)%1;
  X.fillStyle='#8fd3ff'; X.beginPath();
  X.arc(cx-S*.44,cy+S*.17,S*.052*(1+.18*Math.sin((t||0)*6)),0,7); X.fill();
  X.restore();
}
/* La firma: MukiCloud + bajada */
function firma(cx,cy,size,a,sweep){
  X.save(); X.globalAlpha=a;
  X.font=f(size,900); X.textBaseline='middle';
  const w1=X.measureText('Muki').width, w2=X.measureText('Cloud').width, tot=w1+w2;
  X.shadowColor='rgba(59,155,255,.45)'; X.shadowBlur=size*.42;
  X.fillStyle=C.ink;  X.fillText('Muki',cx-tot/2,cy);
  X.fillStyle='#3b9bff'; X.fillText('Cloud',cx-tot/2+w1,cy);
  X.shadowBlur=0;
  if(sweep!=null&&sweep>0&&sweep<1){
    X.save(); X.globalCompositeOperation='screen';
    const gx=lerp(cx-tot*.7,cx+tot*.7,sweep);
    const lg=X.createLinearGradient(gx-160,0,gx+160,0);
    lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(.5,'rgba(220,240,255,.9)');
    lg.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=lg; X.fillText('Muki',cx-tot/2,cy); X.fillText('Cloud',cx-tot/2+w1,cy);
    X.restore();
  }
  X.restore(); return tot;
}
/* ── Capas de acabado: viñeta, grano, barras cine, destello ───────── */
function vignette(strength=.9){
  const g=X.createRadialGradient(W/2,H*.48,H*.28,W/2,H*.5,W*.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  X.fillStyle=g; X.fillRect(0,0,W,H);
}
let grainCv=null, grainCtx=null;
function grain(frame,amt=.055){
  if(!grainCv){grainCv=document.createElement('canvas');grainCv.width=320;grainCv.height=180;grainCtx=grainCv.getContext('2d')}
  const r=mul32(frame*7919+13), im=grainCtx.createImageData(320,180), d=im.data;
  for(let i=0;i<d.length;i+=4){const v=r()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255}
  grainCtx.putImageData(im,0,0);
  X.save(); X.globalAlpha=amt; X.globalCompositeOperation='overlay';
  X.imageSmoothingEnabled=true; X.drawImage(grainCv,0,0,W,H); X.restore();
}
function bars(t){ // 2.39:1
  const h=(H-W/2.39)/2, p=eOut(prog(t,0,1.2));
  X.fillStyle='#000'; X.fillRect(0,0,W,h*p||h); X.fillRect(0,H-h,W,h);
  X.fillStyle='#000'; X.fillRect(0,0,W,h); X.fillRect(0,H-h,W,h);
}
const SAFE={top:(H-W/2.39)/2, bot:H-(H-W/2.39)/2};
function flash(t,a,dur=.22,color='#fff',max=.85){
  const p=prog(t,a,a+dur); if(p<=0||p>=1)return;
  X.save(); X.globalAlpha=(1-p)*max; X.fillStyle=color; X.fillRect(0,0,W,H); X.restore();
}
function lightBeam(cx,cy,r,col,a){
  const g=X.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,col.replace(')',','+a+')').replace('rgb','rgba'));
  g.addColorStop(1,'rgba(0,0,0,0)');
  X.save();X.globalCompositeOperation='screen';X.fillStyle=g;X.fillRect(cx-r,cy-r,r*2,r*2);X.restore();
}

/* ── Panel de UI con perspectiva real (proyección por filas) ──────── */
const off=document.createElement('canvas'); const O=off.getContext('2d');
function panel3d(w,h,draw,o={}){
  off.width=w; off.height=h; O.clearRect(0,0,w,h);
  draw(O,w,h);
  const px=o.x||W/2, py=o.y||H/2, sc=o.scale==null?1:o.scale;
  const tilt=o.tilt||0;          // 0 = de frente, 1 = muy girado
  const skew=o.skew||0;          // inclinación vertical
  const a=o.alpha==null?1:o.alpha;
  X.save(); X.globalAlpha=a;
  const dw=w*sc, dh=h*sc, step=2, rows=Math.ceil(dh/step);
  if(Math.abs(tilt)<0.004 && Math.abs(skew)<0.004){   // de frente: se dibuja entera, sin rebanar
    if(o.shadow){ X.save(); X.shadowColor='rgba(0,0,0,.7)'; X.shadowBlur=90; X.shadowOffsetY=30;
      X.fillStyle='#070a12'; rr(px-dw/2,py-dh/2+8,dw,dh-6,26); X.fill(); X.restore(); }
    X.drawImage(off,px-dw/2,py-dh/2,dw,dh); X.restore(); return;
  }
  if(o.shadow){ // una sola sombra detrás del cuadrilátero proyectado
    X.save(); X.shadowColor='rgba(0,0,0,.7)'; X.shadowBlur=90; X.shadowOffsetY=34;
    X.fillStyle='#070a12'; rr(px-dw*.5*(1+tilt*.12),py-dh/2+8,dw*(1+tilt*.12),dh-6,26); X.fill(); X.restore();
  }
  for(let i=0;i<rows;i++){
    const u=i/rows;                        // 0 arriba → 1 abajo
    const persp=1-tilt*(0.5-u)*0.9;        // ancho por fila
    const sy=u*h, sh=Math.min(h-sy, h/rows+1);
    const rw=dw*persp, rx=px-rw/2 + skew*dw*(0.5-u)*0.5;
    const ry=py-dh/2+u*dh;
    O.canvas && X.drawImage(off,0,sy,w,sh,rx,ry,rw,step+0.6);
  }
  X.restore();
}

/* ── Piezas de UI dibujadas a mano (el sistema real) ──────────────── */
function uiChrome(g,w,h,title,sub){
  g.fillStyle='#0f1320'; rrC(g,0,0,w,h,22); g.fill();
  g.strokeStyle='rgba(59,155,255,.18)'; g.lineWidth=2; rrC(g,1,1,w-2,h-2,22); g.stroke();
  g.fillStyle='#141a2a'; rrC(g,0,0,w,86,22); g.fill(); g.fillRect(0,64,w,22);
  g.fillStyle=C.gold; g.beginPath(); g.arc(40,43,9,0,7); g.fill();
  g.font=f(27,800); g.fillStyle=C.ink; g.textBaseline='middle';
  g.fillText(title,66,44);
  if(sub){g.font=f(19,600);g.fillStyle=C.mute;g.textAlign='right';g.fillText(sub,w-34,44);g.textAlign='left'}
  g.fillStyle='rgba(59,155,255,.5)'; g.fillRect(0,85,w,1.5);
}
function rrC(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function kpiCard(g,x,y,w,h,label,value,color,rev){
  g.fillStyle='#161d2e'; rrC(g,x,y,w,h,14); g.fill();
  g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=1.5; g.stroke();
  g.font=f(16,700); g.fillStyle=C.dim; g.textBaseline='top';
  g.fillText(label.toUpperCase(),x+18,y+16);
  g.font=f(h>120?44:34,800); g.fillStyle=color||C.ink;
  g.fillText(value,x+18,y+h-(h>120?62:48));
  if(rev!=null){g.fillStyle='rgba(255,255,255,.07)';rrC(g,x+18,y+h-20,w-36,6,3);g.fill();
    g.fillStyle=color||C.gold;rrC(g,x+18,y+h-20,(w-36)*rev,6,3);g.fill()}
}
function rowLine(g,x,y,w,a,b,cc,p){
  g.font=f(20,600); g.fillStyle=C.mute; g.textBaseline='middle';
  g.globalAlpha=p; g.fillText(a,x,y);
  g.textAlign='right'; g.font=f(21,800); g.fillStyle=cc||C.ink; g.fillText(b,x+w,y);
  g.textAlign='left'; g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=1; g.beginPath();
  g.moveTo(x,y+22); g.lineTo(x+w,y+22); g.stroke();
}

/* ══════════════════════════════════════════════════════════════════
   ESCENAS
   ══════════════════════════════════════════════════════════════════ */

/* A · 0–4s · La mina. Oscuridad, túnel, algo pasa abajo. */
function scTunel(t){
  X.fillStyle=C.void; X.fillRect(0,0,W,H);
  const cam=eInOut(prog(t,0,4)), z=lerp(0,2.4,cam);
  // anillos del túnel en perspectiva
  const N=26;
  for(let i=N;i>=0;i--){
    const d=(i+ (z%1))*0.55 - z*0.0;
    const k=1/(1+d*0.42);
    const w=W*1.5*k, h=H*1.42*k;
    const a=cl(k*1.25-0.06)*cl(prog(t,0,.9));
    if(a<=0.01) continue;
    X.save(); X.globalAlpha=a*.55;
    X.strokeStyle= i%6===0? 'rgba(59,155,255,.5)' : 'rgba(96,165,250,.22)';
    X.lineWidth=Math.max(1,3.2*k);
    // galería: rectángulo con bóveda
    const x=W/2-w/2, y=H/2-h/2;
    X.beginPath();
    X.moveTo(x,y+h); X.lineTo(x,y+h*.42);
    X.quadraticCurveTo(W/2,y-h*.1,x+w,y+h*.42);
    X.lineTo(x+w,y+h); X.stroke();
    X.restore();
  }
  // polvo en suspensión
  const r=mul32(99);
  for(let i=0;i<150;i++){
    const bx=r()*W, by=r()*H, sp=.2+r()*.9, ph=r()*6.28;
    const x=(bx + t*sp*60)%W, y=by+Math.sin(t*.6+ph)*26;
    const k=.1+r()*.5;
    X.globalAlpha=k*.5*cl(prog(t,.4,1.6)); X.fillStyle='#cfd8e6';
    X.beginPath(); X.arc(x,y,k*2.4,0,7); X.fill();
  }
  X.globalAlpha=1;
  // lámpara del minero: haz que se acerca y titila
  const lp=prog(t,.3,3.4);
  const lx=lerp(W*.33,W*.52,eInOut(lp)), ly=lerp(H*.62,H*.54,lp);
  const flick=1+Math.sin(t*34)*.045+Math.sin(t*7.3)*.06;
  lightBeam(lx,ly,lerp(240,560,lp)*flick,'rgb(150,205,255)',.5*cl(prog(t,.3,1.1)));
  lightBeam(lx,ly,lerp(70,160,lp),'rgb(225,242,255)',.75*cl(prog(t,.3,.9)));
  // texto
  const ta=prog(t,1.1,2.0);
  if(ta>0){
    tracked('EN EL FRENTE DE TRABAJO, NO EN LA OFICINA',W/2,SAFE.bot-118,{size:26,weight:800,track:5,
      align:'center',color:C.gold,alpha:eOut(ta)*cl(1-prog(t,3.5,4))});
  }
  kinetic([[{t:'Aquí'},{t:'nace'},{t:'el'},{t:'costo'},{t:'de'},{t:'cada'},{t:'metro.',c:C.ink,g:'rgba(59,155,255,.5)'}]],t,
    {size:70,y:SAFE.bot-40,start:1.5,stagger:.06,ab:1.3,alpha:cl(1-prog(t,3.5,4))});
  vignette(1.02); flash(t,0,.5,'#000',1);
}

/* B · 4–8s · Arriba nadie lo sabe. */
function scCiego(t){
  const u=t-4;
  X.fillStyle=C.deep; X.fillRect(0,0,W,H);
  // mitad izquierda: la mina (sigue viva)
  X.save(); X.beginPath(); X.rect(0,0,W/2,H); X.clip();
  const g=X.createLinearGradient(0,0,W/2,H);
  g.addColorStop(0,'#0a0d13'); g.addColorStop(1,'#141a26'); X.fillStyle=g; X.fillRect(0,0,W/2,H);
  lightBeam(W*.26,H*.52,330,'rgb(120,190,255)',.4);
  const r=mul32(5);
  for(let i=0;i<9;i++){ // pulsos de datos que nacen y mueren sin salir
    const ph=r()*6.28, sp=.5+r()*.6, y=H*.3+r()*H*.45;
    const x=(W*.1 + ((u*sp*180+r()*600)%(W*.36)));
    X.globalAlpha=cl(.55-Math.abs(x-W*.28)/(W*.3))*.9;
    X.fillStyle=C.gold; X.beginPath(); X.arc(x,y+Math.sin(ph+u)*10,3.4,0,7); X.fill();
  }
  X.globalAlpha=1;
  tracked('MINA · TURNO NOCHE',W*.25,SAFE.top+70,{size:20,weight:800,track:6,align:'center',color:C.gold,alpha:eOut(prog(u,.2,.9))});
  X.restore();
  // mitad derecha: la oficina a ciegas
  X.save(); X.beginPath(); X.rect(W/2,0,W/2,H); X.clip();
  X.fillStyle='#070910'; X.fillRect(W/2,0,W/2,H);
  tracked('OFICINA · 07:00 AM',W*.75,SAFE.top+70,{size:20,weight:800,track:6,align:'center',color:C.dim,alpha:eOut(prog(u,.4,1.1))});
  // tarjetas vacías con guiones
  const labs=['COSTO DEL DÍA','AVANCE DEL FRENTE','STOCK EXPLOSIVOS','PERSONAL EN MINA'];
  labs.forEach((L,i)=>{
    const p=eOut(prog(u,.7+i*.14,1.3+i*.14)); if(p<=0)return;
    const cw=390,chh=112, cx=W*.75-cw/2, cy=H*.3+i*(chh+22)-30;
    X.save(); X.globalAlpha=p*.95; X.translate(0,(1-p)*18);
    X.fillStyle='#0c1020'; rr(cx,cy,cw,chh,14); X.fill();
    X.strokeStyle='rgba(248,113,113,.22)'; X.lineWidth=1.5; X.stroke();
    txt(L,cx+22,cy+34,{size:16,weight:700,color:C.dim});
    const blink=Math.sin(u*6+i)>0?1:.35;
    txt('— — —',cx+22,cy+84,{size:40,weight:800,color:C.red,alpha:blink*.8});
    X.restore();
  });
  X.restore();
  // separador
  X.save(); const sp=eOut(prog(u,.1,.8));
  X.strokeStyle='rgba(248,113,113,'+(.5*sp)+')'; X.lineWidth=2; X.setLineDash([14,12]);
  X.beginPath(); X.moveTo(W/2,SAFE.top); X.lineTo(W/2,SAFE.top+(SAFE.bot-SAFE.top)*sp); X.stroke(); X.restore();

const CAOS=[

function scCaos(t){
  const u=t-8;

  // nube de papeles en 3D con profundidad de campo
  const r=mul32(2024), cam=eInOut(cl(u/8));
  const items=[];
  CAOS.forEach((it,i)=>{
    const ax=(r()-.5)*2.1, ay=(r()-.5)*1.25, az=r();
    items.push({...it,ax,ay,az,rot:(r()-.5)*.26,sp:.5+r()*.8});
  });
  items.sort((a,b)=>b.az-a.az);
  items.forEach((it,i)=>{
    const z = (it.az*3.4 + 3.0 - cam*3.1);           // cámara avanza
    if(z<0.18) return;
    const k = 1.7/z;
    const drift = Math.sin(u*.5*it.sp + it.az*6)*20;
    const x=W/2 + it.ax*W*.42*k + drift, y=H/2 + it.ay*H*.4*k + Math.cos(u*.42+it.az*5)*14;
    const sz=Math.round(30*k), blur=cl(Math.abs(z-1.25)*3.4,0,11);
    const ap=cl(prog(u,.15+i*.055,.75+i*.055))*cl(k*.85)*cl(1-prog(u,7.1,7.9));
    if(ap<=.01||sz<7) return;
    X.save(); X.translate(x,y); X.rotate(it.rot*(1-cam*.4));
    if(blur>.5) X.filter='blur('+blur.toFixed(2)+'px)';
    X.globalAlpha=ap;
    const tw=measure(it.t,sz,700)+36*k, th=sz*2.1;
    X.fillStyle='rgba(12,16,28,.82)'; rr(-tw/2,-th/2,tw,th,8*k); X.fill();
    X.strokeStyle=it.c; X.globalAlpha=ap*.55; X.lineWidth=Math.max(1,2*k); X.stroke();
    X.globalAlpha=ap;
    txt(it.t,0,sz*.36,{size:sz,weight:700,color:it.c,align:'center'});
    X.restore();
  });
  // titular que agita
  const b=cl(prog(u,2.2,2.6));

    kinetic([[{t:'Seis'},{t:'áreas'},{t:'con'},{t:'la'},{t:'gestión'},{t:'fragmentada.',c:C.red,g:'rgba(248,113,113,.4)'}],
             [{t:'Información'},{t:'dispersa.'},{t:'Decisiones'},{t:'tardías.'}]],u,
      {size:64,y:H*.40,start:2.3,stagger:.055,ab:1.2,lh:84});
    X.restore();
  }
  const c2=prog(u,4.9,5.4);
  if(c2>0){
    X.save(); X.globalAlpha=eOut(c2)*cl(1-prog(u,6.8,7.5));
    tracked('EL COSTO REAL SE CONOCE CUANDO YA SE GASTÓ',W/2,SAFE.bot-56,
      {size:30,weight:800,track:9,align:'center',color:C.gold,glow:'rgba(59,155,255,.35)'});

/* E · 20–30s · La arquitectura: frentes → nube → dispositivos. Al segundo. */
const FR=[
  {n:'RA BRENDA',c:'#60a5fa'},{n:'CRNE',c:'#34d399'},{n:'GLSE-2',c:'#f59e0b'},
  {n:'ESCM 4430',c:'#a855f7'},{n:'ESCM 4410',c:'#ef4444'},{n:'SN 5100 NW',c:'#eab308'}

function scArq(t){
  const u=t-20;
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070a11'); g.addColorStop(.55,'#0d1320'); g.addColorStop(1,'#05070b');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // roca: estratos
  X.save(); const rr2=mul32(31);
  for(let i=0;i<26;i++){
    const y=H*.58+i*20+rr2()*12;
    X.globalAlpha=.07+rr2()*.07; X.strokeStyle='#4b5668';
    X.lineWidth=1+rr2()*2; X.beginPath(); X.moveTo(0,y);
    for(let x=0;x<=W;x+=120) X.lineTo(x,y+Math.sin(x*.004+i)*9);
    X.stroke();
  }
  X.restore(); X.globalAlpha=1;
  // superficie
  const sy=620;
  X.save(); X.globalAlpha=.5; X.strokeStyle='rgba(59,155,255,.5)'; X.lineWidth=2;
  X.beginPath(); X.moveTo(0,sy); X.lineTo(W,sy); X.stroke(); X.restore();
  const cam=eInOut(cl(u/10));
  // nodos de frente, abajo
  const nodes=FR.map((fr,i)=>{
    const xx=W*.1+i*(W*.8/5), yy=sy+92+Math.sin(i*1.7)*44;
    return {...fr,x:xx,y:yy};
  });
  // la nube, arriba
  const hub={x:W/2,y:sy-128};
  // dispositivos
  const dev=[{x:W*.17,y:sy-286,n:'GERENCIA'},{x:W/2,y:sy-300,n:'LOGÍSTICA'},{x:W*.83,y:sy-286,n:'JEFE DE GUARDIA'}];
  // galerías: líneas de los frentes al hub
  nodes.forEach((n,i)=>{
    const ap=eOut(prog(u,.3+i*.1,1.1+i*.1)); if(ap<=0)return;
    X.save(); X.globalAlpha=ap*.5; X.strokeStyle=n.c; X.lineWidth=2.4;
    X.beginPath(); X.moveTo(n.x,n.y);
    X.quadraticCurveTo(lerp(n.x,hub.x,.55),lerp(n.y,hub.y,.2),hub.x,hub.y);
    X.stroke(); X.restore();
    // pulso de datos: uno por segundo, "al segundo"
    for(let k=0;k<3;k++){
      const pp=((u*0.9 + i*.17 + k*.34)%1);
      const px=lerp(n.x,hub.x,eInOut(pp)), py=lerp(lerp(n.y,hub.y,eInOut(pp)), lerp(n.y,hub.y,.2), Math.sin(pp*3.14)*.42);
      X.save(); X.globalAlpha=ap*Math.sin(pp*3.1416)*.95; X.shadowColor=n.c; X.shadowBlur=22;
      X.fillStyle=n.c; X.beginPath(); X.arc(px,py,5.2,0,7); X.fill(); X.restore();
    }

    X.save(); X.globalAlpha=ap;
    X.fillStyle='rgba(10,14,24,.9)'; const tw=measure(n.n,19,800)+30;

    X.globalAlpha=ap; txt(n.n,n.x,n.y+43,{size:19,weight:800,color:n.c,align:'center'});
    // nodo
    const bl=1+Math.sin(u*4+i)*.12;

    X.beginPath(); X.arc(n.x,n.y,8.5*bl,0,7); X.fill();
    X.restore();
  });
  // hub nube
  const hp=eOut(prog(u,1.3,2.2));

    X.shadowBlur=0; X.strokeStyle=C.gold; X.lineWidth=2.6; X.stroke();

    [0,1,2].forEach(k=>{const pp=((u*.5+k/3)%1);

      X.beginPath(); X.arc(hub.x,hub.y,rad+pp*120,0,7); X.stroke()});

    tracked('NUBE',hub.x,hub.y+48,{size:13,weight:800,track:5,align:'center',color:C.mute});
    X.restore();
  }
  // dispositivos
  dev.forEach((d,i)=>{
    const ap=eOut(prog(u,2.4+i*.22,3.2+i*.22)); if(ap<=0)return;
    X.save(); X.globalAlpha=ap;
    // enlace hub → device
    X.strokeStyle='rgba(59,155,255,.45)'; X.lineWidth=2; X.setLineDash([7,9]);
    X.beginPath(); X.moveTo(hub.x,hub.y-60); X.lineTo(d.x,d.y+58); X.stroke(); X.setLineDash([]);
    const pp=((u*1.1+i*.3)%1);
    X.globalAlpha=ap*Math.sin(pp*3.1416); X.shadowColor=C.gold; X.shadowBlur=20; X.fillStyle=C.gold2;
    X.beginPath(); X.arc(lerp(hub.x,d.x,pp),lerp(hub.y-60,d.y+58,pp),4.6,0,7); X.fill();
    X.shadowBlur=0; X.globalAlpha=ap;

    X.fillStyle='#0f1526'; rr(d.x-pw/2,d.y-ph/2,pw,ph,10); X.fill();
    X.strokeStyle='rgba(59,155,255,.55)'; X.lineWidth=2; X.stroke();
    const rr3=mul32(i*13+1);
    for(let k=0;k<4;k++){const bw=(pw-30)*(.35+rr3()*.6);

    {size:24,weight:800,track:5,align:'center',color:C.ink});

    X.globalAlpha=(.25+k*.6)*(.6+.4*Math.sin(u*2+k*20))*cl(prog(u,0,1.4));

function rrP(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
/* La marca ALMATRIX: dos eslabones entrelazados.
   Los huecos se recortan del dibujo entero, así se ven huecos de verdad
   sobre cualquier fondo y ninguno de los dos los tapa. */
function rombo(g,cx,cy,S,r){ g.save(); g.translate(cx,cy); g.rotate(Math.PI/4);
  rrP(g,-S/2,-S/2,S,S,r); g.restore() }
function diamante(cx,cy,S,col){ const g=X; g.beginPath(); rombo(g,cx,cy,S,S*0.26);
  g.fillStyle=col; g.fill() }
function marcaAlmatrix(cx,cy,S,a,join,oscuro){
  const g=X, sep=lerp(S*0.95,S*0.30,join);
  const c1x=cx-sep, c2x=cx+sep, hS=S*0.455;
  const az='#0a84ff', bl=oscuro?'#0b0d12':'#ffffff';
  g.save(); g.globalAlpha=a;
  g.beginPath();
  g.rect(cx-S*2.4,cy-S*2.4,S*4.8,S*4.8);
  rombo(g,c1x,cy,hS,hS*0.30);
  rombo(g,c2x,cy,hS,hS*0.30);
  g.clip('evenodd');
  diamante(c1x,cy,S,bl);
  diamante(c2x,cy,S,az);
  if(join>0.5){                       // el blanco vuelve al frente abajo
    g.save(); g.beginPath();
    g.rect(cx-S*2.4,cy,S*4.8,S*2.4); g.clip();
    diamante(c1x,cy,S,bl);
    g.restore();
  }
  g.restore();
}
function lockup(cx,cy,S,a,join,oscuro){
  marcaAlmatrix(cx-S*2.05,cy,S,a,join,oscuro);
  X.save(); X.globalAlpha=a; X.textBaseline='middle'; X.textAlign='left';
  X.font='900 '+(S*0.78)+'px -apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  X.fillStyle=oscuro?'#0b0d12':'#ffffff';
  X.fillText('ALMATRIX',cx-S*0.55,cy-S*0.30);
  X.font='400 '+(S*0.52)+'px -apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  X.fillText('Smart Interactions',cx-S*0.5,cy+S*0.44);
  X.restore();
}

function wrap(texto,x,y,ancho,lh,size,color){
  const pal=texto.split(' '); let linea='', yy=y;
  pal.forEach(p2=>{
    const prueba=linea? linea+' '+p2 : p2;
    if(measure(prueba,size,600)>ancho && linea){ txt(linea,x,yy,{size,weight:600,color}); linea=p2; yy+=lh+6 }
    else linea=prueba;
  });
  if(linea) txt(linea,x,yy,{size,weight:600,color});
}

const DUR=97, TOTAL=DUR*FPS;
function RENDER(frame){
  const t=frame/FPS;
  X.setTransform(1,0,0,1,0,0);
  X.globalAlpha=1; X.globalCompositeOperation='source-over'; X.filter='none';
  X.fillStyle='#000'; X.fillRect(0,0,W,H);
  const sc=TL.find(s=>t>=s.a&&t<s.b)||TL[TL.length-1];
  sc.fn(sc.off==null? t : (t - sc.a + sc.off));
  X.setTransform(1,0,0,1,0,0); X.filter='none'; X.globalAlpha=1;
  bars(t);
  return true;
}
window.RENDER=RENDER; window.TOTAL=TOTAL; window.FPS=FPS; window.DUR=DUR;
RENDER(0);
